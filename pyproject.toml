[project]
name = "omni-agent"
version = "0.1.0"
description = "All-in-one AI Agent SDK with tool execution, MCP, RAG, and multi-agent collaboration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Omni Agent", email = "agent@example.com"}
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.6",
    "tiktoken>=0.5.0",
    "mcp>=1.0.0", # Model Context Protocol SDK
    "asyncpg>=0.29.0", # PostgreSQL async driver
    "pgvector>=0.3.0", # pgvector Python bindings
    "pypdf>=4.0.0", # PDF parsing
    "openai>=1.0.0", # For DashScope API (OpenAI compatible)
    "litellm>=1.50.0,<1.70.0", # Multi-provider LLM support (pinned for langfuse 2.x compatibility)
    "prompt-toolkit>=3.0.0", # CLI interactive REPL
    "langfuse>=2.0.0,<3.0.0", # LLM observability and tracing (v2.x for litellm compatibility)
    "agent-sandbox>=0.0.19",
    "agent-client-protocol>=0.7.0",
]

[project.scripts]
omni-agent = "omni_agent.cli.main:main"
omni-agent-acp = "omni_agent.acp.acp_server:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]
redis = [
    "redis>=5.0.0",  # Redis async client for session storage
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "workspace",
    "quicksort.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top (common with load_dotenv, conditional imports)
    "E722",   # Do not use bare except (existing code pattern in skills)
    "E741",   # Ambiguous variable name (l, I, O used in math/data contexts)
    "B008",   # Function calls in argument defaults (FastAPI Depends pattern)
    "B024",   # Abstract base class without abstract methods
    "B027",   # Empty method in abstract class (intentional for hook base classes)
    "B904",   # Within except clause, raise with from (style preference)
    "F821",   # Undefined name (string-quoted forward references for type hints)
    "N801",   # Class name should use CapWords convention
    "N806",   # Variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["omni_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/omni_agent",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pgvector>=0.4.1",
]
