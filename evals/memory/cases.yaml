  compression_trigger: "rounds"
  grading:
    type: "llm"
    dimensions: ["completeness", "accuracy"]
    criteria: "评估核心记忆是否区分了不同角色的观点和最终结论：1.产品经理小刘的需求（物流轨迹+实时位置+预计到达）2.后端老张的方案（适配层+两周）3.前端小陈的建议（高德地图+一周半）4.测试小赵的要求（Mock测试+降级方案）5.最终排期（三周并行）"
