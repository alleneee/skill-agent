- id: "mem_fact_001"
  tags: ["memory", "fact_retention"]
  max_steps: 10
  timeout: 120
  conversation:
    - role: "user"
      content: "我们启动一个新项目，代号 Phoenix，负责人是王明，截止日期是2024年6月30日。先帮我梳理一下技术栈选型的思路。"
    - role: "assistant"
      content: "好的，项目 Phoenix 已记录。技术栈选型建议从以下几个维度考虑：团队熟悉度、社区活跃度、性能需求、运维成本。你们团队目前主要用什么语言？"
    - role: "user"
      content: "团队主要用 Python 和 Go。后端考虑用 Go 写核心服务，Python 做数据处理。部署方面倾向 Kubernetes。"
    - role: "assistant"
      content: "这个组合很合理。Go 适合高并发的核心服务，Python 处理数据管道。K8s 部署的话建议用 Helm chart 管理，CI/CD 可以考虑 GitHub Actions 或 ArgoCD。"
    - role: "user"
      content: "数据库方面呢？我们有结构化数据和时序数据两种需求。"
    - role: "assistant"
      content: "结构化数据推荐 PostgreSQL，成熟稳定且支持 JSON 字段。时序数据可以看 TimescaleDB，它基于 PostgreSQL 扩展，团队学习成本低。如果数据量特别大也可以考虑 ClickHouse。"
    - role: "user"
      content: "Go 的 Web 框架你推荐哪个？Gin 还是 Echo？"
    - role: "assistant"
      content: "两个都不错。Gin 社区更大，中间件生态丰富，性能也很好。Echo 的路由设计更优雅，内置的中间件比较完善。如果团队没有明确偏好，建议选 Gin，招人也好招。"
    - role: "user"
      content: "消息队列呢？我们有一些异步任务和事件驱动的场景。"
    - role: "assistant"
      content: "Kafka 适合高吞吐的事件流处理，RabbitMQ 适合任务队列和 RPC 场景。你们的异步任务如果量不大，NATS 也是个轻量选择。建议先评估消息量级再决定。"
    - role: "user"
      content: "监控和可观测性怎么搭建？我希望上线后能快速定位问题。"
    - role: "assistant"
      content: "推荐 Prometheus + Grafana 做指标监控，Jaeger 做分布式链路追踪，Loki 收集日志。这三件套配合 K8s 生态非常成熟。Go 服务用 OpenTelemetry SDK 埋点，Python 也有对应的库。"
    - role: "user"
      content: "API 文档怎么管理？团队之前用的 Swagger，感觉维护起来挺麻烦的。"
    - role: "assistant"
      content: "Go 的话可以用 swag 库从代码注释自动生成 Swagger 文档，减少手动维护。也可以考虑 Protocol Buffers 定义接口，同时生成文档和客户端代码。API 变更走 PR Review 流程，确保文档和代码同步。"
    - role: "user"
      content: "微服务之间的通信用 gRPC 还是 REST？"
    - role: "assistant"
      content: "内部服务间通信推荐 gRPC，性能好、类型安全、双向流支持。对外暴露的 API 用 REST，方便前端和第三方调用。可以在 API Gateway 层做协议转换，内部 gRPC 外部 REST。"
    - role: "user"
      content: "测试策略怎么定？我们之前测试覆盖率不到 30%，想这次做好一点。"
    - role: "assistant"
      content: "建议分三层：单元测试覆盖核心业务逻辑目标 80%以上，集成测试覆盖 API 和数据库交互，E2E 测试覆盖关键用户路径。Go 的 testing 包加 testify 就够用，Python 用 pytest。CI 里加覆盖率检查卡点。"
  injected_facts: ["Phoenix", "王明", "6月30日"]
  query: "之前讨论的项目关键信息是什么？负责人是谁？截止日期？"
  test_level: "L1"
  compression_trigger: "rounds"
  grading:
    type: "memory"
    injected_facts: ["Phoenix", "王明", "6月30日"]
    min_retention_rate: 0.6

- id: "mem_fact_002"
  tags: ["memory", "fact_retention"]
  max_steps: 10
  timeout: 120
  conversation:
    - role: "user"
      content: "对接第三方支付系统，API端点是 https://api.example.com/v3，认证方式用 Bearer Token，速率限制每分钟500次。帮我写个对接方案。"
    - role: "assistant"
      content: "收到。针对这个支付 API 的对接，建议分三层实现：HTTP 客户端层负责认证和限流、业务逻辑层处理支付流程、错误处理层做重试和降级。Bearer Token 建议存在环境变量里，不要硬编码。"
    - role: "user"
      content: "限流这块怎么实现比较好？我不想因为超限被封。"
    - role: "assistant"
      content: "推荐用令牌桶算法。Python 的话可以用 aiolimiter 库，设置每分钟 450 次留点余量。也可以自己实现一个简单的滑动窗口计数器。关键是要在客户端做限流，不要依赖服务端的 429 响应。"
    - role: "user"
      content: "如果遇到 429 了怎么办？"
    - role: "assistant"
      content: "做指数退避重试。第一次等 1 秒，第二次 2 秒，第三次 4 秒，最多重试 3 次。同时解析响应头里的 Retry-After 字段，如果有的话按它的值等待。重试期间把请求放到队列里排队。"
    - role: "user"
      content: "支付回调怎么处理？对方会 POST 通知到我们的 webhook。"
    - role: "assistant"
      content: "webhook 接收端要做几件事：验签确保请求来自支付平台、幂等处理防止重复通知、异步入库不要在回调里做重逻辑。建议先返回 200 再异步处理业务，避免超时导致对方重发。"
    - role: "user"
      content: "对账怎么做？怕出现支付成功但我们没收到回调的情况。"
    - role: "assistant"
      content: "定时对账很重要。每天凌晨拉取支付平台的交易记录，和我们的订单表做比对。差异记录生成对账报告，人工处理异常单。另外可以在支付发起后设置一个延时任务，30分钟内没收到回调就主动查询。"
    - role: "user"
      content: "退款流程呢？用户申请退款后怎么和支付平台交互？"
    - role: "assistant"
      content: "退款流程：用户申请 -> 客服审核 -> 调用支付平台退款 API -> 等待退款回调 -> 更新订单状态。要注意部分退款的场景，一笔订单可能退多次。退款金额累计不能超过原交易金额，这个在业务层做校验。"
    - role: "user"
      content: "多币种的支付怎么处理？我们后面可能要支持美元和日元。"
    - role: "assistant"
      content: "多币种支持要注意几点：金额用最小单位存储避免浮点精度问题，比如美元存分、日元直接存整数。汇率转换在下单时锁定，不要用支付时的实时汇率。结算的时候按币种分账，和支付平台确认支持的币种列表。"
    - role: "user"
      content: "安全方面还有什么需要注意的？"
    - role: "assistant"
      content: "支付安全几个要点：所有通信走 HTTPS、敏感信息加密存储不落日志、支付请求加签名防篡改、限制同一用户的支付频率防刷单。另外建议接入风控系统，对大额交易做二次验证。PCI DSS 合规如果处理卡号的话要特别注意。"
  injected_facts: ["api.example.com/v3", "Bearer Token", "500"]
  query: "之前说的API配置信息是什么？"
  test_level: "L1"
  compression_trigger: "rounds"
  grading:
    type: "memory"
    injected_facts: ["api.example.com/v3", "Bearer Token", "500"]
    min_retention_rate: 0.8

- id: "mem_fact_003"
  tags: ["memory", "fact_retention"]
  max_steps: 10
  timeout: 120
  conversation:
    - role: "user"
      content: "新采购了一台服务器，配置是16核CPU，64GB内存，2TB SSD，部署在 us-east-1 区域。帮我规划一下上面跑什么服务合适。"
    - role: "assistant"
      content: "这个配置适合跑中等规模的服务集群。建议：数据库服务分配 32GB 内存和 8 核，应用服务分配 16GB 和 4 核，剩余资源给监控和日志系统。SSD 空间的话数据库占 1TB，日志和备份占剩余部分。"
    - role: "user"
      content: "容器化部署还是直接装？"
    - role: "assistant"
      content: "单机的话推荐 Docker Compose，比 K8s 轻量很多。把每个服务做成容器，用 docker-compose.yml 统一编排。数据库的数据卷映射到 SSD 的专用分区，这样性能和管理都有保障。"
    - role: "user"
      content: "网络配置有什么建议吗？"
    - role: "assistant"
      content: "us-east-1 延迟对北美用户很友好。建议前面加一层 CloudFront CDN，静态资源缓存到边缘节点。安全组只开放 80/443 对外，数据库端口只允许内网访问。另外配置一个 VPC 把这台机器和其他资源隔离。"
    - role: "user"
      content: "备份策略怎么做？数据丢了就完蛋了。"
    - role: "assistant"
      content: "三层备份：数据库每天自动 pg_dump 到 S3，保留30天。SSD 做每周一次的快照，保留4个。关键配置文件用 Git 管理。建议再加一个跨区域备份到 us-west-2，防止整个区域挂掉。定期做恢复演练验证备份有效。"
    - role: "user"
      content: "SSL 证书怎么管理？我们有好几个子域名。"
    - role: "assistant"
      content: "用 Let's Encrypt 免费证书，配合 certbot 自动续期。多个子域名可以申请通配符证书 *.example.com，一张证书搞定所有子域。Nginx 做反向代理统一管理 HTTPS 终端。设置 cron 任务每月检查证书过期时间。"
    - role: "user"
      content: "系统监控除了应用层还需要关注什么？"
    - role: "assistant"
      content: "主机层面要监控：CPU/内存/磁盘使用率、网络流量、磁盘 IOPS。设置告警阈值：CPU 持续 >80% 告警、磁盘 >85% 告警、内存 >90% 告警。用 node_exporter 采集指标推送到 Prometheus。重点关注 SSD 的写入寿命，2TB SSD 在高写入场景下注意 SMART 数据。"
    - role: "user"
      content: "如果流量增长了怎么扩容？单机扛不住了。"
    - role: "assistant"
      content: "短期方案：纵向扩容，升级到更高配置的实例。中期方案：应用服务做无状态设计，方便水平扩展到多台机器，前面加负载均衡。长期方案：迁移到 K8s 集群，用 HPA 自动伸缩。数据库可以先加读副本分摊查询压力。"
    - role: "user"
      content: "运维自动化有什么建议？不想每次手动登上去操作。"
    - role: "assistant"
      content: "用 Ansible 做配置管理和部署自动化，Playbook 版本化。日常操作封装成 Makefile 或脚本，比如重启服务、查看日志、清理磁盘。严禁直接 SSH 改配置，所有变更走代码仓库和 CI/CD。设置堡垒机做审计，记录所有操作日志。"
  injected_facts: ["16核", "64GB", "2TB", "us-east-1"]
  query: "服务器的硬件配置和区域是什么？"
  test_level: "L1"
  compression_trigger: "rounds"
  grading:
    type: "memory"
    injected_facts: ["16核", "64GB", "2TB", "us-east-1"]
    min_retention_rate: 0.6

- id: "mem_fact_004"
  tags: ["memory", "fact_retention"]
  max_steps: 10
  timeout: 120
  conversation:
    - role: "user"
      content: "先说一下我的开发习惯：我习惯用 vim 编辑，pytest 测试，prefer 函数式编程风格。后续帮我写代码的时候注意这些偏好。"
    - role: "assistant"
      content: "明白了，我会注意：编辑器 vim、测试框架 pytest、偏好函数式风格。写代码时会优先使用纯函数、避免副作用、多用 map/filter/reduce 等。有其他偏好也可以随时补充。"
    - role: "user"
      content: "帮我想想怎么重构现在的用户认证模块，目前是面向对象写的，类之间耦合很重。"
    - role: "assistant"
      content: "函数式重构思路：把认证逻辑拆成独立的纯函数管道。比如 validate_token -> decode_payload -> check_permissions，每个函数只做一件事，通过组合串起来。状态用 dataclass 或 NamedTuple 传递，不要用可变对象。"
    - role: "user"
      content: "测试怎么写比较好？"
    - role: "assistant"
      content: "纯函数的好处就是测试简单。每个函数独立测试，输入确定输出就确定。用 pytest 的 parametrize 装饰器批量测试不同输入组合，fixture 管理测试数据。不需要 mock 太多东西，因为函数没有外部依赖。"
    - role: "user"
      content: "密码哈希这块怎么处理？现在用的 MD5 太老了。"
    - role: "assistant"
      content: "立刻迁移到 bcrypt 或 argon2，这两个是目前推荐的密码哈希算法。argon2 是 PHC 竞赛冠军，安全性最高。迁移策略：新注册用户直接用新算法，老用户下次登录时透明升级哈希。写个迁移函数检测哈希类型自动路由。"
    - role: "user"
      content: "JWT 的 refresh token 机制怎么设计？"
    - role: "assistant"
      content: "access token 短有效期比如15分钟，refresh token 长有效期比如7天。refresh token 存数据库，支持主动吊销。用纯函数实现：create_token_pair(user_id) -> (access, refresh)、refresh_access_token(refresh) -> new_access。token rotation：每次刷新生成新的 refresh token，旧的失效。"
    - role: "user"
      content: "权限系统要支持 RBAC，角色和权限怎么建模？"
    - role: "assistant"
      content: "三张表：users、roles、permissions，加两张关联表 user_roles 和 role_permissions。函数式设计：get_user_permissions(user_id) 返回权限集合，has_permission(permissions, required) 做纯判断。用装饰器 @require_permission('admin:write') 在路由上声明式鉴权。"
    - role: "user"
      content: "OAuth2 第三方登录要不要支持？"
    - role: "assistant"
      content: "建议支持 Google 和 GitHub OAuth2，覆盖大部分用户。用 authlib 库处理 OAuth2 流程，回调处理函数做账号关联：已有账号则绑定，没有则自动创建。把 OAuth2 Provider 做成策略模式，后续加微信、Apple 登录只需添加新的 Provider 实现。"
    - role: "user"
      content: "安全日志怎么做？登录失败、权限拒绝这些要记录。"
    - role: "assistant"
      content: "安全事件用结构化日志记录：事件类型、用户ID、IP地址、时间戳、结果。写一个 log_security_event 纯函数统一处理。登录连续失败5次自动锁定账户30分钟。安全日志单独存储，保留至少90天。可以接入 SIEM 系统做异常检测。"
    - role: "user"
      content: "Session 管理有什么最佳实践？"
    - role: "assistant"
      content: "如果用 JWT 就是无状态的，不需要服务端 session。如果需要服务端 session，用 Redis 存储，TTL 设置30分钟，每次请求刷新。关键点：session ID 用加密安全的随机数生成、cookie 设置 httponly 和 secure 标志、支持多设备同时在线但限制最大数量。"
  injected_facts: ["vim", "pytest", "函数式"]
  query: "用户的开发偏好是什么？"
  test_level: "L2"
  compression_trigger: "rounds"
  grading:
    type: "memory"
    injected_facts: ["vim", "pytest", "函数式"]
    min_retention_rate: 0.6

