- id: "multi_dependency_fix_005"
  task: |
    The project has circular import issues. Fix them:
    1. Read all Python files in the workspace
    2. Identify the circular dependency
    3. Fix it by restructuring the imports
    4. Make sure all files still have their original functionality
  tags: ["multi_step", "debug", "refactor"]
  max_steps: 20
  timeout: 90
  setup:
    files:
      "models.py": |
        from services import UserService

        class User:
            def __init__(self, name: str):
                self.name = name

            def get_service(self) -> "UserService":
                return UserService(self)
      "services.py": |
        from models import User

        class UserService:
            def __init__(self, user: User):
                self.user = user

            def create_user(self, name: str) -> User:
                return User(name)
  grading:
    type: "outcome"
    checks:
      - file_contains: ["models.py", "class User"]
      - file_contains: ["services.py", "class UserService"]
      - file_contains: ["services.py", "def create_user"]

- id: "multi_test_coverage_006"
  task: |
    The file string_utils.py has several functions but no tests.
    Create comprehensive tests in test_string_utils.py covering:
    1. Normal cases for each function
    2. Edge cases (empty string, None, special characters)
    3. Run the tests with pytest and report results
  tags: ["multi_step", "testing"]
  max_steps: 25
  timeout: 120
  setup:
    files:
      "string_utils.py": |
        def capitalize_words(text: str) -> str:
            return " ".join(word.capitalize() for word in text.split())

        def reverse_string(text: str) -> str:
            return text[::-1]

        def count_vowels(text: str) -> int:
            return sum(1 for c in text.lower() if c in "aeiou")

        def is_palindrome(text: str) -> bool:
            cleaned = "".join(c.lower() for c in text if c.isalnum())
            return cleaned == cleaned[::-1]
  grading:
    type: "outcome"
    checks:
      - file_exists: "test_string_utils.py"
      - file_contains: ["test_string_utils.py", "capitalize_words"]
      - file_contains: ["test_string_utils.py", "reverse_string"]
      - file_contains: ["test_string_utils.py", "count_vowels"]
      - file_contains: ["test_string_utils.py", "is_palindrome"]
      - file_contains: ["test_string_utils.py", "def test_"]

- id: "multi_data_pipeline_007"
  task: |
    Build a data processing pipeline:
    1. Read the raw data from data.csv
    2. Create a script process.py that:
       - Reads the CSV
       - Filters rows where age > 25
       - Sorts by age descending
       - Writes output to filtered.csv
    3. Run the script and verify filtered.csv is created with correct data
  tags: ["multi_step", "data"]
  max_steps: 15
  timeout: 60
  setup:
    files:
      "data.csv": |
        name,age,score
        Alice,30,85
        Bob,22,90
        Charlie,35,78
        Diana,20,92
        Eve,28,88
        Frank,45,75
  grading:
    type: "outcome"
    checks:
      - file_exists: "process.py"
      - file_exists: "filtered.csv"
      - file_contains: ["filtered.csv", "Alice"]
      - file_contains: ["filtered.csv", "Charlie"]
      - file_contains: ["filtered.csv", "Eve"]
      - file_not_contains: ["filtered.csv", "Bob"]
      - file_not_contains: ["filtered.csv", "Diana"]

- id: "multi_error_handling_008"
  task: |
    Improve the error handling in api_client.py:
    1. Add proper exception handling for network errors, timeout, and invalid JSON
    2. Add retry logic with max 3 retries
    3. Add logging for each retry attempt
    4. Create a custom exception class ApiError
  tags: ["multi_step", "refactor", "error_handling"]
  max_steps: 15
  timeout: 60
  setup:
    files:
      "api_client.py": |
        import urllib.request
        import json

        def fetch_data(url: str) -> dict:
            response = urllib.request.urlopen(url)
            data = response.read()
            return json.loads(data)

        def post_data(url: str, payload: dict) -> dict:
            data = json.dumps(payload).encode()
            req = urllib.request.Request(url, data=data)
            response = urllib.request.urlopen(req)
            return json.loads(response.read())
  grading:
    type: "outcome"
    checks:
      - file_contains: ["api_client.py", "class ApiError"]
      - file_contains: ["api_client.py", "retry"]
      - file_contains: ["api_client.py", "except"]
      - file_contains: ["api_client.py", "def fetch_data"]
      - file_contains: ["api_client.py", "def post_data"]

