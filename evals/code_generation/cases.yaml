- id: "codegen_fix_bugs_005"
  task: |
    The file linked_list.py has several bugs. Find and fix all of them.
    After fixing, run the test to verify all tests pass.
  tags: ["codegen", "debug"]
  max_steps: 25
  timeout: 120
  setup:
    files:
      "linked_list.py": |
        class Node:
            def __init__(self, value):
                self.value = value
                self.next = None

        class LinkedList:
            def __init__(self):
                self.head = None
                self.size = 0

            def append(self, value):
                node = Node(value)
                if self.head is None:
                    self.head = node
                else:
                    current = self.head
                    while current is not None:
                        current = current.next
                    current.next = node
                self.size += 1

            def get(self, index):
                if index < 0 or index > self.size:
                    raise IndexError("Index out of range")
                current = self.head
                for i in range(index):
                    current = current.next
                return current.value

            def remove(self, value):
                if self.head is None:
                    return False
                if self.head.value == value:
                    self.head = self.head.next
                    return True
                current = self.head
                while current.next is not None:
                    if current.next.value == value:
                        current.next = current.next.next
                        self.size -= 1
                        return True
                    current = current.next
                return False

            def to_list(self):
                result = []
                current = self.head
                while current is not None:
                    result.append(current.value)
                    current = current.next
                return result
      "test_linked_list.py": |
        from linked_list import LinkedList

        def test_append():
            ll = LinkedList()
            ll.append(1)
            ll.append(2)
            ll.append(3)
            assert ll.to_list() == [1, 2, 3]
            assert ll.size == 3

        def test_get():
            ll = LinkedList()
            ll.append(10)
            ll.append(20)
            ll.append(30)
            assert ll.get(0) == 10
            assert ll.get(1) == 20
            assert ll.get(2) == 30

        def test_remove():
            ll = LinkedList()
            ll.append(1)
            ll.append(2)
            ll.append(3)
            assert ll.remove(2) == True
            assert ll.to_list() == [1, 3]
            assert ll.size == 2

        if __name__ == "__main__":
            test_append()
            test_get()
            test_remove()
            print("All tests passed!")
  grading:
    type: "outcome"
    checks:
      - file_contains: ["linked_list.py", "class LinkedList"]
      - file_contains: ["linked_list.py", "def append"]
      - result_matches: "(?i)(pass|fixed|bug)"

